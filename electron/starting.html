<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Starting pi-fleet</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #starting{text-align:center;padding:16px}
  h1{margin:0 0 8px;font-size:18px;font-weight:600}
  .logo{color:#58a6ff}
  p{margin:0;color:#8b949e;word-break:break-word}
  .spinner{display:inline-block;width:16px;height:16px;margin-top:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="starting">
  <h1><span class="logo">◆</span> Starting your fleet</h1>
  <p id="project"></p>
  <div class="spinner"></div>
</div>
<script>
  document.getElementById("project").textContent = new URLSearchParams(location.search).get("project");
</script>
</body>
</html>
