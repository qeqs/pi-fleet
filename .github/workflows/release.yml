name: Release

# On a version tag: prove a clean machine can install and use each form of the release,
# then publish it. On a milestone branch: the same proof, with no release at the end.
on:
  push:
    tags: ["v*"]
    branches: ["milestone-7*"]

permissions:
  contents: read

jobs:
  npm-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install -g "github:${{ github.repository }}#${{ github.sha }}"
        shell: bash
      - run: node scripts/check-install.mjs

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install the app and finish a task in it
        shell: bash
        run: |
          echo "PI_FLEET_APP=$(node scripts/install-app.mjs)" >> "$GITHUB_ENV"
      - name: Run the desktop tests against the installed app
        if: runner.os != 'Linux'
        run: npx vitest run test/desktop.test.ts
      - name: Run the desktop tests against the installed app
        if: runner.os == 'Linux'
        run: xvfb-run -a npx vitest run test/desktop.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [npm-install, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - run: npm pack --pack-destination assets
      - run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md) and [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/GETTING_STARTED.md)."
        env:
          GH_TOKEN: ${{ github.token }}
