name: CI

on:
  push:
    branches: [main, "milestone-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      # two test files at a time: real agents and a browser are heavy for a small runner
      - run: npm test -- --maxWorkers=2 --exclude test/desktop.test.ts
      # the desktop app on its own, with a display on Linux
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} npx vitest run test/desktop.test.ts
