<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-fleet</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;--purple:#bc8cff;--user:#1f6feb;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  header h1 .logo{color:var(--accent)}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
  header .dot.on{background:var(--green)}
  header .meta{color:var(--muted);font-size:12px;margin-left:auto}
  header button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
  header button:hover{background:#262c36}
  header button.danger:hover{border-color:var(--red);color:var(--red)}
  header button:disabled{opacity:.5;cursor:default}
  .pausedbar{flex:0 0 auto;padding:7px 16px;background:#d2992222;border-bottom:1px solid var(--amber);color:var(--amber);font-size:13px}
  .pausedbar button{margin-left:10px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
  .question{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 16px;background:#1f6feb22;border-bottom:1px solid var(--accent);font-size:13px}
  .question .qtext{flex:1 1 240px;word-break:break-word}
  .question input{flex:1 1 180px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:13px}
  .question button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
  .question button.primary{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  .layout{flex:1;display:grid;grid-template-columns:240px 1fr;min-height:0}
  .sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .side-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px 6px}
  .chatlist{flex:1;overflow-y:auto;padding:0 8px}
  .chat{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--text);font-size:13px}
  .chat:hover{background:var(--panel2)}
  .chat.active{background:#1f6feb22;color:var(--accent)}
  .chat .cdot{width:8px;height:8px;border-radius:50%;background:#30363d;flex:0 0 auto}
  .chat .cdot.busy{background:var(--amber)}.chat .cdot.idle{background:var(--green)}.chat .cdot.stopped{background:var(--muted)}.chat .cdot.waiting{background:var(--accent)}
  .chat .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat .csess{margin-left:auto;color:var(--muted);font-size:10px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-actions{padding:10px;border-top:1px solid var(--border)}
  .side-actions button{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px;font-size:13px;cursor:pointer}
  .side-actions button:hover{background:#262c36}
  .main{display:flex;flex-direction:column;min-height:0;min-width:0}
  .chat-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap}
  .chat-header .title{font-weight:600;font-size:14px}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
  .badge.idle{background:#1f6feb33;color:var(--accent)}.badge.busy{background:#d2992233;color:var(--amber)}
  .badge.stopped,.badge.starting{background:#30363d;color:var(--muted)}
  .badge.waiting{background:var(--accent);color:#04121f}
  .chat-header .hmeta{color:var(--muted);font-size:12px}
  .chat-header .hbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .chat-header .hbtns button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .chat-header .hbtns button:hover{background:#262c36}
  .chat-header .hbtns button.danger:hover{border-color:var(--red);color:var(--red)}
  .chat-header .chsummary{flex-basis:100%;color:var(--muted);font-size:12px;padding:6px 0 0;border-top:1px solid var(--border);margin-top:4px;font-style:italic}
  .conversation{flex:1;overflow-y:auto;padding:18px 20px}
  .empty{color:var(--muted);font-style:italic;text-align:center;padding:40px 12px}
  .msg{margin-bottom:14px;max-width:920px}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--user);color:#fff;padding:8px 12px;border-radius:12px 12px 3px 12px;max-width:75%;white-space:pre-wrap;word-wrap:break-word}
  .msg.system{color:var(--muted);font-size:12px;text-align:center;font-style:italic}
  .msg .who{font-weight:600;font-size:12px;color:var(--purple);margin-bottom:3px}
  .msg .who .t{color:var(--muted);font-weight:400;margin-left:8px}
  .bubble{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;word-wrap:break-word}
  .bubble h2,.bubble h3,.bubble h4{margin:10px 0 6px}
  .bubble p{margin:6px 0}
  .bubble pre{background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:10px;overflow-x:auto;font-size:12px}
  .bubble code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px}
  .bubble :not(pre)>code{background:#262c36;padding:1px 5px;border-radius:4px}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
  .bubble table{border-collapse:collapse;margin:8px 0;font-size:13px}
  .bubble th,.bubble td{border:1px solid var(--border);padding:4px 10px;text-align:left}
  .bubble th{background:var(--panel2)}
  .bubble blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--border);color:var(--muted)}
  .wake{margin-bottom:14px;max-width:920px;color:var(--muted);font-size:12px}
  .wake summary{cursor:pointer;user-select:none}
  .wake pre{white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;margin:6px 0 0}
  .firstrun{max-width:560px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
  .firstrun h2{margin:0;font-size:18px}
  .firstrun p{margin:0;color:var(--muted)}
  .firstrun input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px}
  .firstrun label{color:var(--muted);font-size:12px}
  .template{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  .template .tdesc{flex:1;color:var(--muted);font-size:13px}
  .template b{min-width:50px}
  .template button{background:var(--accent);color:#04121f;border:none;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
  .template button:disabled{opacity:.5;cursor:default}
  .firstrun .err{color:var(--red);font-size:12px;min-height:16px}
  .unread{margin-left:auto;background:var(--accent);color:#04121f;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600}
  .chat .unread + .csess{margin-left:6px}
  .agentrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
  .agentrow input,.agentrow select{min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:12px}
  .mbody button.plain{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-right:6px}
  .hit{padding:7px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12px;word-break:break-word}
  .hit:hover{background:var(--panel2)}
  .hit .hmeta{color:var(--muted);display:block;margin-bottom:2px}
  .diff{background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;overflow:auto;max-height:50vh;margin:8px 0;white-space:pre}
  .diff .add{color:var(--green)}.diff .del{color:var(--red)}.diff .hunk{color:var(--accent)}
  .step{padding:2px 0 2px 12px;color:var(--muted);font-size:12px;word-break:break-word}
  .step b{color:var(--text);font-weight:600}
  .chat-header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px;max-width:220px}
  .bubble a{color:var(--accent)}
  .thinking{margin:6px 0;border:1px dashed #3a3f4a;border-radius:8px;background:#12161d}
  .thinking .th{cursor:pointer;color:var(--muted);font-size:12px;padding:6px 10px;user-select:none}
  .thinking .th:hover{color:var(--text)}
  .thinking .tb{display:none;padding:0 12px 10px;color:var(--muted);font-size:12px;white-space:pre-wrap;font-style:italic}
  .thinking.open .tb{display:block}
  .tool{margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel2);overflow:hidden}
  .tool .thead{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;user-select:none}
  .tool .thead:hover{background:#232a34}
  .tool .tname{font-weight:600;font-size:12px;font-family:ui-monospace,monospace}
  .tool .tstatus{font-size:11px;color:var(--muted)}
  .tool .tstatus.ok{color:var(--green)}.tool .tstatus.err{color:var(--red)}.tool .tstatus.run{color:var(--amber)}
  .tool .chev{margin-left:auto;color:var(--muted);font-size:11px}
  .tool .tbody{display:none;border-top:1px solid var(--border)}
  .tool.open .tbody{display:block}
  .tool .tsec{padding:8px 12px;font-size:12px}
  .tool .tsec .lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .tool .tsec pre{margin:0;background:#0a0e14;border-radius:6px;padding:8px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
  .tool .tsec.err pre{color:#ffb3ad}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid #30363d;border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .composer{flex:0 0 auto;border-top:1px solid var(--border);background:var(--panel);padding:12px 16px}
  .composer .row{display:flex;gap:8px;max-width:920px;margin:0 auto}
  .composer textarea{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none;max-height:160px;min-height:42px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer button{background:var(--accent);color:#04121f;border:none;border-radius:8px;padding:0 18px;font-weight:600;cursor:pointer;font-size:13px}
  .composer button:disabled{opacity:.5;cursor:default}
  .composer .hint{max-width:920px;margin:6px auto 0;color:var(--muted);font-size:11px}
  .composer .hint.err{color:var(--red)}
  /* Settings modal */
  .overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:min(720px,92vw);max-height:86vh;display:flex;flex-direction:column}
  .modal .mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
  .modal .mhead h2{margin:0;font-size:15px}
  .modal .mhead .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  .tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--border)}
  .tabs button{background:none;border:none;color:var(--muted);padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  .mbody{padding:16px 18px;overflow-y:auto;font-size:13px}
  .mbody h3{font-size:13px;margin:14px 0 6px;color:var(--text)}
  .mbody h3:first-child{margin-top:0}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{color:var(--muted);font-size:12px}
  .field input,.field select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px}
  .mrow .nm{font-weight:600}
  .mrow .desc{color:var(--muted);font-size:12px;flex:1}
  .mrow button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .mrow button:hover{background:#262c36}
  .mrow button.del:hover{border-color:var(--red);color:var(--red)}
  .chk{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer}
  .chk input{width:16px;height:16px}
  .chk .scope{color:var(--muted);font-size:11px;margin-left:auto}
  .stat{color:var(--muted);font-size:12px}
  .stat b{color:var(--text)}
  .modal.dialog{width:min(440px,92vw)}
  .dialog-error{color:var(--red);font-size:12px;white-space:pre-wrap;margin-bottom:10px}
  .dialog-error:empty{display:none}
  .dialog-actions{display:flex;justify-content:flex-end}
  .dialog-actions button{background:var(--accent);color:#04121f;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
  .dialog-actions button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <div class="dot" id="conn"></div>
  <h1><span class="logo">◆</span> pi-fleet</h1>
  <span class="meta" id="meta">connecting…</span>
  <button id="stopAllBtn" class="danger" title="Abort every run and hold agent messages until you write again">⏹ Stop all</button>
  <button id="settingsBtn">⚙ Settings</button>
</header>
<div class="pausedbar" id="pausedBar" hidden><span id="pausedText"></span><button id="resumeBtn" hidden></button></div>
<div id="questionBar"></div>
<datalist id="modelList"></datalist>
<div class="layout">
  <aside class="sidebar">
    <div class="side-title">Chats</div>
    <div class="chatlist" id="chatList"></div>
    <div class="side-actions">
      <button id="newChatBtn">＋ New chat</button>
    </div>
  </aside>
  <main class="main">
    <div class="chat-header" id="chatHeader"></div>
    <div class="conversation" id="conversation"></div>
    <div class="composer" id="composer"></div>
  </main>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h2>Settings</h2><button class="x" id="closeSettings">×</button></div>
    <div class="tabs" id="tabs">
      <button data-tab="fleet" class="active">Fleet</button>
      <button data-tab="channels">Channels</button>
      <button data-tab="plugins">Plugins</button>
      <button data-tab="mcp">MCP</button>
      <button data-tab="usage">Usage</button>
      <button data-tab="search">Search</button>
      <button data-tab="tasks">Tasks</button>
      <button data-tab="timeline">Timeline</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>
<div class="overlay" id="dialog">
  <form class="modal dialog" id="dialogForm">
    <div class="mhead"><h2 id="dialogTitle"></h2><button type="button" class="x" id="dialogClose">×</button></div>
    <div class="mbody">
      <div id="dialogFields"></div>
      <div class="dialog-error" id="dialogError"></div>
      <div class="dialog-actions"><button type="submit" id="dialogSubmit"></button></div>
    </div>
  </form>
</div>
<script>
(function () {
  "use strict";
  // the startup link carried the access token; the cookie has it now, so drop it from the address bar
  if (location.search) history.replaceState(null, "", location.pathname);
  // ---------- utilities ----------
  /* markdown.cjs */
  function esc(s) { return escapeHtml(s); }
  function time(ts) { var d = ts ? new Date(ts) : new Date(); return d.toTimeString().slice(0, 8); }
  function extractText(content) {
    if (typeof content === "string") return content;
    if (Array.isArray(content)) return content.map(function (b) { return (b && b.text) || ""; }).join("");
    return "";
  }
  function md(src) { return renderMarkdown(src); }
  function jsonStr(o) { try { return JSON.stringify(o, null, 2); } catch (e) { return String(o); } }

  // ---------- state ----------
  var state = {
    agents: {},            // name -> { info, status, model, sessionName, stats }
    channels: [],          // [{name, members, supervisor, summary}]
    group: [],             // bus messages (all channels + DMs)
    conv: {},              // name -> { items: [], live: {text,thinking,tools,active} }
    selected: "group",     // "group" | "#<channel>" | an agent name
    paused: null,          // why the fleet is paused, if it is
    held: 0,               // agent messages the pause is holding back
    questions: [],         // agents waiting for an answer
    maxCost: null,         // spending limit in dollars, if any
    routerStats: null,     // what the dedicated router has used
    templates: [],         // crews for the first-run screen
    defaultModel: "",      // the model new agents get, if set
    models: [],            // every model pi knows, as provider/id
    changesOf: "",         // the agent whose changes are on show
    openBlocks: {},        // tool cards and details a person has opened, by key
    drafts: {},            // unsent text per chat, kept across re-renders and reconnects
    unread: {},            // new messages per chat since it was last open
    mcp: { mcpServers: {} },
    extensions: { available: [], selected: {} },
    settingsTab: "fleet"
  };

  // channel selection helpers: "group" is the default channel, "#name" a named one
  function isChannelSel(sel) { return sel === "group" || (typeof sel === "string" && sel.indexOf("#") === 0); }
  function channelNameOf(sel) { return sel === "group" ? "group" : String(sel).slice(1); }
  function getChannel(name) { for (var i = 0; i < state.channels.length; i++) if (state.channels[i].name === name) return state.channels[i]; return null; }
  // a channel shows what was said in it, plus the DMs between its members that do the work
  function inChannel(m, name) {
    if (m.to === name) return true;
    var c = getChannel(name);
    return m.kind === "chat" && !!c && c.members.indexOf(m.from) >= 0 && c.members.indexOf(m.to) >= 0;
  }
  function channelMessages(name) {
    var c = getChannel(name);
    var after = (c && c.clearedAt) || 0;
    return state.group.filter(function (m) { return inChannel(m, name) && m.ts > after; });
  }

  // ---------- conversation model ----------
  function getConv(name) { if (!state.conv[name]) state.conv[name] = { items: [], live: null }; return state.conv[name]; }

  function assistantItemFromMessage(m) {
    var blocks = [];
    var content = Array.isArray(m.content) ? m.content : [];
    for (var i = 0; i < content.length; i++) {
      var b = content[i];
      if (b.type === "text") blocks.push({ type: "text", text: b.text || "" });
      else if (b.type === "thinking") blocks.push({ type: "thinking", text: b.thinking || "" });
      else if (b.type === "toolCall") blocks.push({ type: "tool", id: b.id, name: b.name, args: b.arguments, result: undefined, duration: undefined, isError: false, running: false });
    }
    return { type: "assistant", blocks: blocks, ts: m.timestamp, usage: m.usage };
  }

  // the same message, whether it came from the history or from live events
  function itemKey(it) { return it.type === "user" ? "user:" + it.text : it.type + ":" + (it.ts || it.id); }

  function seedFromMessages(name, messages) {
    var conv = getConv(name);
    var items = [];
    var toolById = {};
    (messages || []).forEach(function (m) {
      if (m.role === "user") {
        items.push({ type: "user", text: extractText(m.content), ts: m.timestamp });
      } else if (m.role === "assistant") {
        var it = assistantItemFromMessage(m);
        it.blocks.forEach(function (b) { if (b.type === "tool" && b.id) toolById[b.id] = b; });
        items.push(it);
      } else if (m.role === "toolResult") {
        var t = toolById[m.toolCallId];
        if (t) { t.result = extractText(m.content); t.isError = !!m.isError; }
        else items.push({ type: "toolresult", id: m.toolCallId, name: m.toolName, text: extractText(m.content), isError: !!m.isError });
      }
    });
    // the history can arrive after live events, and may be older than they are, so it only adds to them
    var live = conv.items.map(itemKey);
    var older = items.filter(function (it) {
      var at = live.indexOf(itemKey(it));
      if (at >= 0) live.splice(at, 1);
      return at < 0;
    });
    conv.items = older.concat(conv.items);
  }

  // apply a live RPC event to an agent's conversation model
  function applyEvent(name, ev) {
    var conv = getConv(name);
    var t = ev.type;
    if (t === "agent_start") { conv.live = { text: "", thinking: "", tools: [], active: true }; }
    else if (t === "message_update") {
      var ame = ev.assistantMessageEvent || {};
      if (!conv.live) conv.live = { text: "", thinking: "", tools: [], active: true };
      if (ame.type === "text_delta" && ame.delta) conv.live.text += ame.delta;
      else if (ame.type === "thinking_delta" && ame.delta) conv.live.thinking += ame.delta;
      else if (ame.type === "toolcall_end" && ame.toolCall) conv.live.tools.push({ id: ame.toolCall.id, name: ame.toolCall.name, args: ame.toolCall.arguments, running: false });
    }
    else if (t === "message_end" && ev.message && ev.message.role === "user") {
      var said = extractText(ev.message.content);
      // what the composer already showed comes back here: it must not appear twice
      if (conv.echo === said) conv.echo = null;
      else conv.items.push({ type: "user", text: said, ts: ev.message.timestamp });
    }
    else if (t === "message_end" && ev.message && ev.message.role === "assistant") {
      var it = assistantItemFromMessage(ev.message);
      (conv.live ? conv.live.tools : []).forEach(function (lt) {
        var match = it.blocks.filter(function (b) { return b.type === "tool" && b.id === lt.id; })[0];
        if (match) match.running = lt.running;
      });
      conv.items.push(it);
      conv.live = null;
    }
    else if (t === "tool_execution_start") {
      var tool = findTool(name, ev.toolCallId);
      if (tool) { tool.running = true; tool.args = ev.args || tool.args; }
    }
    else if (t === "tool_execution_end") {
      var tool2 = findTool(name, ev.toolCallId);
      if (tool2) { tool2.running = false; tool2.isError = !!ev.isError; tool2.duration = ev.durationMs; tool2.result = extractText(ev.result && ev.result.content); }
    }
    else if (t === "agent_settled") { conv.live = null; }
  }

  function findTool(name, id) {
    var conv = state.conv[name]; if (!conv) return null;
    for (var i = conv.items.length - 1; i >= 0; i--) {
      var it = conv.items[i];
      if (it.type === "assistant") for (var j = 0; j < it.blocks.length; j++) if (it.blocks[j].type === "tool" && it.blocks[j].id === id) return it.blocks[j];
    }
    if (conv.live) for (var k = 0; k < conv.live.tools.length; k++) if (conv.live.tools[k].id === id) return conv.live.tools[k];
    return null;
  }

          h2 += '<label class="chk"><input type="checkbox" data-agent="' + esc(n) + '" data-path="' + esc(e.path) + '"' + checked + "><span>" + esc(e.name) + '</span><span class="scope">' + esc(e.scope) + "</span></label>";
        });
      });
      mbodyEl.innerHTML = h2;
      mbodyEl.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
        cb.onchange = function () {
          var agent = cb.getAttribute("data-agent");
          var cur = (state.extensions.selected[agent] || []).slice();
          if (cb.checked) cur.push(cb.getAttribute("data-path")); else cur = cur.filter(function (p) { return p !== cb.getAttribute("data-path"); });
          state.extensions.selected[agent] = cur;
          post("/extensions", { agent: agent, extensions: cur });
        };
      });
    } else if (tab === "mcp") {
      var h3 = "<h3>MCP servers</h3><div class='stat' style='margin-bottom:10px'>Edits <code>~/.pi/agent/mcp.json</code> (user-level, applies to all agents). Run <code>/reload</code> in a session or restart agents to pick up changes.</div>";
      var servers = state.mcp.mcpServers || {};
      var keys = Object.keys(servers);
      if (!keys.length) h3 += '<div class="stat">No MCP servers configured.</div>';
      keys.forEach(function (k) {
        var s = servers[k];
        var desc = s.command ? (esc(s.command) + " " + esc((s.args || []).join(" "))) : (s.url ? esc(s.url) : "");
        h3 += '<div class="mrow"><span class="nm">' + esc(k) + '</span><span class="desc">' + desc + '</span><button class="del" data-mcpdel="' + esc(k) + '">Remove</button></div>';
      });
      h3 += '<h3>Add server</h3>' +
        '<div class="field"><label>Name</label><input id="mcpName" placeholder="filesystem"></div>' +
        '<div class="row2">' +
        '<div class="field"><label>Command (stdio)</label><input id="mcpCmd" placeholder="npx"></div>' +
        '<div class="field"><label>Args (space-separated)</label><input id="mcpArgs" placeholder="-y @modelcontextprotocol/server-filesystem ."></div>' +
        "</div>" +
        '<div class="field"><label>Or URL (http / streamable-http)</label><input id="mcpUrl" placeholder="https://example.com/mcp"></div>' +
        '<div class="field"><label>Env (KEY=VALUE, space-separated, optional)</label><input id="mcpEnv" placeholder="API_KEY=..."></div>' +
        '<button id="mcpAdd" style="background:var(--accent);color:#04121f;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer">Add server</button>';
      mbodyEl.innerHTML = h3;
      mbodyEl.querySelectorAll("[data-mcpdel]").forEach(function (b) { b.onclick = function () { mcpRemove(b.getAttribute("data-mcpdel")); }; });
      var addBtn = document.getElementById("mcpAdd");
      if (addBtn) addBtn.onclick = mcpAdd;
    } else if (tab === "usage") {
      var router = state.routerStats;
      var spent = agentNames().reduce(function (sum, n) { var s = state.agents[n].stats; return sum + Number((s && s.cost) || 0); }, Number((router && router.cost) || 0));
      var h4 = "<h3>Usage & cost</h3>";
      h4 += '<div class="stat" style="margin-bottom:10px">Spent so far: <b>$' + spent.toFixed(4) + "</b>" + (state.maxCost ? " of a $" + esc(state.maxCost) + " limit" : " (no limit)") + "</div>";
      h4 += '<div class="field"><label>Spending limit in dollars: the fleet pauses when it is reached</label><input id="budgetInput" value="' + esc(state.maxCost || "") + '" placeholder="e.g. 5"></div><button id="budgetSave">Save limit</button><h3>By agent</h3>';
      agentNames().forEach(function (n) {
        var a = state.agents[n];
        var s = a.stats;
        if (!s) { h4 += '<div class="mrow"><span class="nm">@ ' + esc(n) + '</span><span class="desc">no stats yet</span></div>'; return; }
        h4 += '<div class="mrow"><span class="nm">@ ' + esc(n) + '</span><span class="desc">' + (s.totalMessages || 0) + " msgs · " + (s.toolCalls || 0) + " tools</span><span class=\"stat\"><b>$" + Number(s.cost || 0).toFixed(4) + "</b> · " + (s.tokens && s.tokens.total || 0) + " tok</span></div>";
      });
      if (router) h4 += '<div class="mrow"><span class="nm">router</span><span class="desc">routing channel messages</span><span class="stat"><b>$' + Number(router.cost || 0).toFixed(4) + "</b> · " + (router.tokens && router.tokens.total || 0) + " tok</span></div>";
      mbodyEl.innerHTML = h4;
      document.getElementById("budgetSave").onclick = function () {
        post("/budget", { dollars: Number(document.getElementById("budgetInput").value) }).then(function (r) {
          if (!r.ok) alert("Could not set the limit: " + (r.error || ""));
        });
      };
    }
  }
  var WHY = { routed: "routed to", mention: "mentioned", direct: "messaged", channel: "posted in" };

  function renderTimelineTask(t) {
    var cost = t.cost != null ? " · $" + Number(t.cost).toFixed(4) : "";
    var head = '<div class="stat"><b>' + esc(t.text.slice(0, 120)) + "</b> " + time(t.ts) + cost + "</div>";
    return '<div class="hit" style="cursor:default">' + head + t.steps.map(function (s) {
      return '<div class="step"><b>' + esc(s.from) + "</b> " + esc(WHY[s.why]) + " <b>" + esc(s.to) + "</b>: " + esc(s.text.slice(0, 100)) + "</div>";
    }).join("") + "</div>";
  }

  function renderDiff(patch) {
    return patch.split("\n").map(function (line) {
      var cls = /^\+/.test(line) ? "add" : /^-/.test(line) ? "del" : /^@@/.test(line) ? "hunk" : "";
      return '<span class="' + cls + '">' + esc(line) + "</span>";
    }).join("\n");
  }

  function renderChanges() {
    var name = state.changesOf;
    mbodyEl.innerHTML = "<h3>Changes by @" + esc(name) + '</h3><div class="stat">Loading…</div>';
    get("/diff?agent=" + encodeURIComponent(name)).then(function (r) {
      if (state.settingsTab !== "changes") return;
      if (!r.ok) { mbodyEl.innerHTML = '<div class="stat">' + esc(r.error) + "</div>"; return; }
      var c = r.result;
      mbodyEl.innerHTML = "<h3>Changes by @" + esc(name) + '</h3><div class="stat">' + esc(c.branch) + " against " + esc(c.base) + ": " + c.files.length + " file(s)</div>" +
        (c.files.length ? '<pre class="diff">' + renderDiff(c.patch) + '</pre><button class="plain" id="mergeBtn">Merge into ' + esc(c.base) + "</button>" : "") +
        '<div class="stat" id="mergeStatus" style="margin-top:8px"></div>';
      var btn = document.getElementById("mergeBtn");
      if (btn) btn.onclick = function () {
        btn.disabled = true;
        post("/merge", { name: name }).then(function (m) {
          btn.disabled = false;
          var status = document.getElementById("mergeStatus");
          if (!m.ok) status.textContent = "Not merged: " + m.error;
          else if (m.result.conflicts.length) status.textContent = "Conflicts in " + m.result.conflicts.join(", ") + ". @" + name + " has been asked to resolve them.";
          else status.textContent = m.result.merged ? "Merged." : "Nothing to merge.";
        });
      };
    });
  }

  var ROLES = ["", "planner", "implementer", "reviewer", "supervisor"];

  function agentRow(a) {
    return '<div class="agentrow">' +
      '<input data-f="name" placeholder="name" value="' + esc(a.name || "") + '">' +
      '<input data-f="cwd" placeholder="folder" value="' + esc(a.cwd || "") + '">' +
      '<input data-f="model" list="modelList" placeholder="model" value="' + esc(a.model || "") + '">' +
      '<select data-f="role">' + ROLES.map(function (r) { return '<option value="' + r + '"' + (r === (a.role || "") ? " selected" : "") + ">" + (r || "(no role)") + "</option>"; }).join("") + "</select>" +
      '<button class="plain" data-del="1">×</button></div>';
  }

  // the file on disk is the source of truth, so the form is always loaded fresh
  function renderFleetTab() {
    get("/config").then(function (r) {
      if (state.settingsTab !== "fleet") return;
      var c = r.result || { agents: [] };
      mbodyEl.innerHTML = '<h3>Fleet</h3><div class="stat" style="margin-bottom:10px">Saved to <code>fleet.json</code>. Takes effect the next time the fleet starts; running agents stay as they are.</div>' +
        '<div class="row2"><div class="field"><label>Default model</label><input id="cfgDefaultModel" list="modelList" value="' + esc(c.defaultModel || "") + '"></div>' +
        '<div class="field"><label>Router model (a cheap one is enough)</label><input id="cfgRouterModel" list="modelList" value="' + esc(c.routerModel || "") + '"></div>' +
        '<div class="field"><label>Turns per run (empty: 100, 0: no limit)</label><input id="cfgMaxTurns" value="' + esc(c.maxTurns == null ? "" : c.maxTurns) + '"></div>' +
        '<div class="field"><label>Agent messages per human message (empty: 40, 0: no limit)</label><input id="cfgMaxHops" value="' + esc(c.maxHops == null ? "" : c.maxHops) + '"></div></div>' +
        '<h3>Agents</h3><div id="cfgAgents">' + (c.agents || []).map(agentRow).join("") + "</div>" +
        '<button class="plain" id="cfgAdd">Add agent</button><button class="plain" id="cfgSave">Save</button><div class="stat" id="cfgStatus" style="margin-top:8px"></div>';
      document.getElementById("cfgAdd").onclick = function () { document.getElementById("cfgAgents").insertAdjacentHTML("beforeend", agentRow({})); };
      document.getElementById("cfgAgents").addEventListener("click", function (e) { if (e.target.hasAttribute("data-del")) e.target.parentElement.remove(); });
      document.getElementById("cfgSave").onclick = saveFleetConfig;
    });
  }

  function saveFleetConfig() {
    var value = function (id) { return document.getElementById(id).value.trim(); };
    var number = function (id) { var v = value(id); return v === "" ? undefined : Number(v); };
    var agents = [].map.call(document.querySelectorAll("#cfgAgents .agentrow"), function (row) {
      var a = {};
      row.querySelectorAll("[data-f]").forEach(function (f) { if (f.value.trim()) a[f.getAttribute("data-f")] = f.value.trim(); });
      return a;
    });
    post("/config", { defaultModel: value("cfgDefaultModel") || undefined, routerModel: value("cfgRouterModel") || undefined, maxTurns: number("cfgMaxTurns"), maxHops: number("cfgMaxHops"), maxCost: state.maxCost || undefined, agents: agents }).then(function (r) {
      document.getElementById("cfgStatus").textContent = r.ok ? "Saved." : "Not saved: " + r.error;
    });
  }

  function runSearch(query) {
    if (!query) return;
    get("/search?q=" + encodeURIComponent(query)).then(function (r) {
      var hits = r.result || [];
      document.getElementById("searchHits").innerHTML = hits.length ? hits.map(function (m) {
        return '<div class="hit" data-to="' + esc(m.to) + '"><span class="hmeta">' + esc(m.from) + " → " + esc(m.to) + " · " + new Date(m.ts).toLocaleString() + "</span>" + esc(m.text.slice(0, 240)) + "</div>";
      }).join("") : '<div class="stat">No matches.</div>';
    });
  }

  // ---------- actions ----------
  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .catch(function (e) { return { ok: false, error: String(e) }; });
  }
  function get(url) {
    return fetch(url)
      .then(function (r) { return r.json(); })
      .catch(function (e) { return { ok: false, error: String(e) }; });
  }
  function rpc(agent, command, payload) {
    return post("/rpc", { agent: agent, command: command, payload: payload || {} });
  }

  function send() {
    var input = document.getElementById("msgInput");
    if (!input) return;
    var text = input.value.trim();
    if (!text) return;
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    state.drafts[state.selected] = "";
    if (isChannelSel(state.selected)) {
      var to = (document.getElementById("toSel") || {}).value || "group";
      var target = to.indexOf("#") === 0 ? to.slice(1) : to; // "#dev" -> "dev"; "group"/"alice" unchanged
      post("/message", { to: target, text: text }).then(function (r) { if (!r.ok) sendFailed(text, r.error); });
    } else {
      // followUp queues the message if the agent is mid-turn (e.g. polling its inbox)
      var conv = getConv(state.selected);
      conv.items.push({ type: "user", text: text, ts: Date.now() });
      conv.echo = text;
      renderConversation();
      rpc(state.selected, "prompt", { message: text, streamingBehavior: "followUp" }).then(function (r) {
        var refused = r.ok && r.result && r.result.success === false;
        if (!r.ok || refused) sendFailed(text, refused ? r.result.error : r.error);
      });
    }
    input.value = "";
  }

  // nothing the user typed is lost: the text goes back in the box, with the reason under it
  function sendFailed(text, reason) {
    var input = document.getElementById("msgInput");
    if (input && !input.value) { input.value = text; state.drafts[state.selected] = text; }
    var hint = composerEl.querySelector(".hint");
    if (hint) { hint.textContent = "Not sent: " + (reason || "request failed"); hint.classList.add("err"); }
  }

  function selectChat(name) {
    state.selected = name;
    delete state.unread[name];
    showUnreadTotal();
    if (!isChannelSel(name)) {
      // agent: seed the conversation from the agent's session if not already loaded
      var conv = getConv(name);
      if (!conv.seeded) {
        conv.seeded = true;
        rpc(name, "get_messages").then(function (r) {
          if (r.ok && r.result && r.result.data && r.result.data.messages) {
            seedFromMessages(name, r.result.data.messages);
            if (state.selected === name) renderConversation();
          } else conv.seeded = false;
        });
      }
    }
    renderAll();
  }

  // ---------- form dialog (the desktop shell has no window.prompt) ----------
  var dialogEl = document.getElementById("dialog");
  var dialogForm = document.getElementById("dialogForm");
  var dialogSubmitBtn = document.getElementById("dialogSubmit");
  var dialogErrorEl = document.getElementById("dialogError");
  var dialogFieldsEl = document.getElementById("dialogFields");
  var dialogAction = null;

  function fieldHtml(f) {
    var control = f.options
      ? '<select name="' + esc(f.name) + '">' + f.options.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o || "(none)") + "</option>"; }).join("") + "</select>"
      : '<input name="' + esc(f.name) + '" value="' + esc(f.value || "") + '" placeholder="' + esc(f.placeholder || "") + '"' + (f.list ? ' list="' + esc(f.list) + '"' : "") +
        (f.required ? " required" : "") + (f.pattern ? ' pattern="' + esc(f.pattern) + '" title="' + esc(f.hint || "") + '"' : "") + ">";
    return '<div class="field"><label>' + esc(f.label) + "</label>" + control + "</div>";
  }

  // opts: { title, action, fields, submit(values) -> Promise<{ok, error}> }; stays open and shows the error on failure
  function openDialog(opts) {
    dialogAction = opts.submit;
    document.getElementById("dialogTitle").textContent = opts.title;
    dialogSubmitBtn.textContent = opts.action;
    dialogSubmitBtn.disabled = false;
    dialogErrorEl.textContent = "";
    dialogFieldsEl.innerHTML = opts.fields.map(fieldHtml).join("");
    dialogEl.classList.add("show");
    var first = dialogFieldsEl.querySelector("input,select") || dialogSubmitBtn;
    first.focus();
    if (first.select) first.select();
  }
  function closeDialog() { dialogEl.classList.remove("show"); dialogAction = null; }

  function newChat() {
    openDialog({
      title: "New agent",
      action: "Start agent",
      fields: [
        { name: "name", label: "Name", value: "agent-" + (agentNames().length + 1), required: true, pattern: "[A-Za-z0-9_\\-]{1,64}", hint: "Letters, digits, _ and -" },
        { name: "cwd", label: "Working directory (empty: the fleet root)" },
        { name: "model", label: "Model (empty: the default)", placeholder: "provider/model", list: "modelList" },
        { name: "role", label: "Role", options: ["", "planner", "implementer", "reviewer", "supervisor"] }
      ],
      submit: function (v) {
        var spec = { name: v.name };
        if (v.cwd) spec.cwd = v.cwd;
        if (v.model) spec.model = v.model;
        if (v.role) spec.role = v.role;
        return post("/agents", spec);
      }
    });
  }

  function renameSession(name) {
    openDialog({
      title: "Session name for " + name,
      action: "Save",
      fields: [{ name: "session", label: "Display name", value: state.agents[name].sessionName || name, required: true }],
      submit: function (v) { return post("/session-name", { name: name, sessionName: v.session }); }
    });
  }

  function headerAction(act) {
    var name = state.selected;
    if (isChannelSel(name)) {
      if (act === "clear-channel") post("/channels/clear", { name: channelNameOf(name) });
      else if (act === "manage-channel") { state.settingsTab = "channels"; syncTabs(); renderSettings(); overlayEl.classList.add("show"); }
      return;
    }
    if (act === "changes") { state.changesOf = name; state.settingsTab = "changes"; syncTabs(); renderSettings(); overlayEl.classList.add("show"); }
    else if (act === "restart") post("/agents/restart", { name: name }).then(reportFailure);
    else if (act === "stop-agent") post("/agents/stop", { name: name }).then(reportFailure);
    else if (act === "remove") confirmRemove(name);
    else if (act === "new-session") rpc(name, "new_session").then(function () { state.conv[name] = { items: [], live: null }; renderConversation(); });
    else if (act === "rename") renameSession(name);
    else if (act === "compact") rpc(name, "compact");
    else if (act === "abort") rpc(name, "abort");
  }

  function reportFailure(r) { if (!r.ok) alert(r.error || "Request failed"); }

  function confirmRemove(name) {
    openDialog({
      title: "Remove " + name + "?",
      action: "Remove agent",
      fields: [],
      submit: function () { return post("/agents/remove", { name: name }); }
    });
  }

  function mcpAdd() {
    var name = (document.getElementById("mcpName") || {}).value.trim();
    var cmd = (document.getElementById("mcpCmd") || {}).value.trim();
    var args = (document.getElementById("mcpArgs") || {}).value.trim();
    var url = (document.getElementById("mcpUrl") || {}).value.trim();
    var env = (document.getElementById("mcpEnv") || {}).value.trim();
    if (!name) { alert("Name is required"); return; }
    var entry = {};
    if (cmd) { entry.command = cmd; if (args) entry.args = args.split(/\s+/); }
    else if (url) { entry.url = url; }
    else { alert("Provide a command (stdio) or a URL (http)"); return; }
    if (env) { entry.env = {}; env.split(/\s+/).forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) entry.env[kv.slice(0, i)] = kv.slice(i + 1); }); }
    state.mcp.mcpServers[name] = entry;
    post("/mcp", state.mcp).then(function () { renderSettings(); });
  }
  function mcpRemove(name) {
    delete state.mcp.mcpServers[name];
    post("/mcp", state.mcp).then(function () { renderSettings(); });
  }

  // ---------- SSE ----------
  var lastConvRender = 0;
  function scheduleConvRender(immediate) {
    var now = Date.now();
    if (immediate || now - lastConvRender > 80) { lastConvRender = now; renderConversation(); }
    else if (!scheduleConvRender._t) scheduleConvRender._t = setTimeout(function () { scheduleConvRender._t = null; lastConvRender = Date.now(); renderConversation(); }, 80);
  }

  function loadModels() {
    get("/models").then(function (r) {
      if (!r.ok) return;
      state.models = r.result || [];
      document.getElementById("modelList").innerHTML = state.models.map(function (m) { return '<option value="' + esc(m) + '">'; }).join("");
      renderHeader();
    });
  }

  function onSnapshot(snap) {
    state.agents = {};
    (snap.agents || []).forEach(function (a) { state.agents[a.name] = { info: a, status: a.status, model: a.model, role: a.role, sessionName: a.sessionName, stats: (snap.stats || {})[a.name] || null }; });
    state.group = snap.messages || [];
    state.channels = snap.channels || [];
    if (!state.channels.some(function (c) { return c.name === "group"; })) state.channels.unshift({ name: "group", members: agentNames(), supervisor: null });
    if (isChannelSel(state.selected)) {
      if (channelNameOf(state.selected) !== "group" && !getChannel(channelNameOf(state.selected))) state.selected = "group";
    } else if (!state.agents[state.selected]) {
      state.selected = "group";
    }
    metaEl.textContent = agentNames().length + " agent(s)";
    state.templates = snap.templates || [];
    state.defaultModel = snap.defaultModel || "";
    state.routerStats = (snap.stats || {}).router || null;
    state.paused = snap.paused || null;
    state.held = snap.held || 0;
    state.questions = snap.questions || [];
    state.maxCost = snap.maxCost || null;
    renderPaused();
    renderQuestions();
    renderAll();
    if (!state.models.length) loadModels();
    // refresh mcp + extensions
    fetch("/mcp").then(function (r) { return r.json(); }).then(function (m) { state.mcp = m; }).catch(function () {});
    fetch("/extensions").then(function (r) { return r.json(); }).then(function (e) { state.extensions = e; }).catch(function () {});
  }

  var es = new EventSource("/events");
  es.onopen = function () { connEl.className = "dot on"; };
  es.onerror = function () { connEl.className = "dot"; };
  es.addEventListener("snapshot", function (e) { onSnapshot(JSON.parse(e.data)); });
  es.addEventListener("message", function (e) {
    var m = JSON.parse(e.data);
    state.group.push(m);
    if (state.group.length > 300) state.group = state.group.slice(-300);
    if (isChannelSel(state.selected) && inChannel(m, channelNameOf(state.selected))) renderConversation();
    var key = m.to === "group" ? "group" : getChannel(m.to) ? "#" + m.to : null;
    if (key && key !== state.selected && m.kind === "chat") markUnread(key);
  });
  es.addEventListener("agent_event", function (e) {
    var d = JSON.parse(e.data);
    applyEvent(d.name, d.event);
    if (state.selected !== d.name && d.event.type === "message_end" && d.event.message && d.event.message.role === "assistant") markUnread(d.name);
    if (state.selected === d.name) {
      var isDelta = d.event.type === "message_update";
      scheduleConvRender(!isDelta);
    }
  });
  es.addEventListener("status", function (e) {
    var s = JSON.parse(e.data);
    if (state.agents[s.name]) { state.agents[s.name].status = s.status; renderSidebar(); if (state.selected === s.name) renderHeader(); }
  });
  es.addEventListener("paused", function (e) {
    var p = JSON.parse(e.data);
    if (p.reason && !state.paused) notify("Fleet paused: " + p.reason);
    state.paused = p.reason;
    state.held = p.held || 0;
    renderPaused();
  });
  es.addEventListener("agent_removed", function (e) {
    var name = JSON.parse(e.data).name;
    delete state.agents[name];
    delete state.unread[name];
    if (state.selected === name) state.selected = "group";
    metaEl.textContent = agentNames().length + " agent(s)";
    renderAll();
  });
  es.addEventListener("question", function (e) {
    var q = JSON.parse(e.data);
    state.questions.push(q);
    renderQuestions();
    notify("@" + q.agent + " is waiting for you: " + q.title);
  });
  es.addEventListener("question_gone", function (e) { var id = JSON.parse(e.data).id; state.questions = state.questions.filter(function (q) { return q.id !== id; }); renderQuestions(); });
  es.addEventListener("stats", function (e) {
    var s = JSON.parse(e.data);
    if (s.name === "router") state.routerStats = s.stats;
    if (state.agents[s.name]) { state.agents[s.name].stats = s.stats; if (state.selected === s.name) renderHeader(); }
    if (overlayEl.classList.contains("show") && state.settingsTab === "usage" && document.activeElement.id !== "budgetInput") renderSettings();
  });
  es.addEventListener("budget", function (e) { state.maxCost = JSON.parse(e.data).maxCost; if (state.settingsTab === "usage") renderSettings(); });
  es.addEventListener("agent_added", function (e) {
    var a = JSON.parse(e.data);
    // the "to" picker is patched, not re-rendered: that would wipe a draft in the composer
    var toSel = document.getElementById("toSel");
    if (toSel && !state.agents[a.name]) toSel.add(new Option("@ " + a.name, a.name));
    state.agents[a.name] = { info: a, status: a.status, model: a.model, role: a.role, sessionName: a.sessionName, stats: null };
    metaEl.textContent = agentNames().length + " agent(s)";
    if (agentNames().length === 1) renderAll(); // the first agent: the first-run screen gives way
    else renderSidebar();
    if (state.selected === a.name) renderHeader();
  });
  es.addEventListener("session_name", function (e) {
    var s = JSON.parse(e.data);
    if (state.agents[s.name]) { state.agents[s.name].sessionName = s.sessionName; renderSidebar(); if (state.selected === s.name) renderHeader(); }
  });
  es.addEventListener("channels", function (e) {
    state.channels = JSON.parse(e.data);
    if (!state.channels.some(function (c) { return c.name === "group"; })) state.channels.unshift({ name: "group", members: agentNames(), supervisor: null });
    renderSidebar();
    if (isChannelSel(state.selected)) { renderHeader(); renderConversation(); }
  });
  es.addEventListener("extensions", function (e) { var s = JSON.parse(e.data); state.extensions.selected[s.agent] = s.extensions; });
  es.addEventListener("mcp", function (e) { state.mcp = JSON.parse(e.data); });

  // ---------- wiring ----------
  chatListEl.addEventListener("click", function (e) {
    var chat = e.target.closest(".chat");
    if (chat) selectChat(chat.getAttribute("data-chat"));
  });
  document.getElementById("newChatBtn").onclick = newChat;
  document.getElementById("questionBar").addEventListener("click", answerClicked);
  convEl.addEventListener("click", conversationClicked);
  headerEl.addEventListener("change", function (e) {
    if (e.target.id !== "modelPick") return;
    var name = state.selected;
    var slash = e.target.value.indexOf("/");
    rpc(name, "set_model", { provider: e.target.value.slice(0, slash), modelId: e.target.value.slice(slash + 1) }).then(function (r) {
      if (r.ok && (!r.result || r.result.success !== false)) state.agents[name].model = e.target.value;
      else reportFailure({ error: (r.result && r.result.error) || r.error });
      renderHeader();
    });
  });
  mbodyEl.addEventListener("click", function (e) {
    var hit = e.target.closest(".hit");
    if (!hit) return;
    var to = hit.getAttribute("data-to");
    overlayEl.classList.remove("show");
    selectChat(to === "group" ? "group" : getChannel(to) ? "#" + to : to);
  });
  document.getElementById("resumeBtn").onclick = function () { post("/resume", {}); };
  var stopAllBtn = document.getElementById("stopAllBtn");
  stopAllBtn.onclick = function () {
    stopAllBtn.disabled = true;
    post("/stop-all", {}).then(function (r) {
      stopAllBtn.disabled = false;
      if (!r.ok) alert("Could not stop the fleet: " + (r.error || ""));
    });
  };
  dialogForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!dialogAction) return;
    var values = {};
    new FormData(dialogForm).forEach(function (v, k) { values[k] = String(v).trim(); });
    dialogSubmitBtn.disabled = true;
    dialogErrorEl.textContent = "";
    dialogAction(values).then(function (r) {
      dialogSubmitBtn.disabled = false;
      if (r.ok) closeDialog(); else dialogErrorEl.textContent = r.error || "Request failed";
    });
  });
  document.getElementById("dialogClose").onclick = closeDialog;
  dialogEl.addEventListener("click", function (e) { if (e.target === dialogEl) closeDialog(); });
  dialogEl.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDialog(); });
  headerEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (b) headerAction(b.getAttribute("data-act"));
  });
  document.getElementById("settingsBtn").onclick = function () { state.settingsTab = "fleet"; syncTabs(); renderSettings(); overlayEl.classList.add("show"); };
  document.getElementById("closeSettings").onclick = function () { overlayEl.classList.remove("show"); };
  overlayEl.addEventListener("click", function (e) { if (e.target === overlayEl) overlayEl.classList.remove("show"); });
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (b) { state.settingsTab = b.getAttribute("data-tab"); syncTabs(); renderSettings(); }
  });
  function syncTabs() {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === state.settingsTab); });
  }

  // initial render
  renderAll();
})();
</script>
</body>
</html>
